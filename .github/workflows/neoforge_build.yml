name: NeoForge Build

# Builds and tests the NeoForge port in the Neoforge/ subfolder.
# Additive and self-contained: does not touch the Fabric build_status.yml / release.yml
# workflows, and only runs when the NeoForge sources or this workflow change.

on:
    push:
        branches: ['*']
        paths:
            - 'Neoforge/**'
            - '.github/workflows/neoforge_build.yml'
    pull_request:
        paths:
            - 'Neoforge/**'
            - '.github/workflows/neoforge_build.yml'

env:
    JAVA_VERSION: 21

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: Neoforge
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up JDK ${{ env.JAVA_VERSION }}
                uses: actions/setup-java@v4
                with:
                    distribution: 'microsoft'
                    java-version: ${{ env.JAVA_VERSION }}
                    cache: 'gradle'
            -   name: Grant execute permission for gradlew
                run: chmod +x ./gradlew
            -   name: Build with Gradle
                run: ./gradlew build
            -   name: Run GameTest suite
                run: ./gradlew runGameTestServer
            -   name: Upload build artifacts (NeoForge)
                continue-on-error: true
                uses: actions/upload-artifact@v4
                with:
                    name: hookshot-neoforge-${{ github.sha }}
                    path: Neoforge/build/libs/*.jar
